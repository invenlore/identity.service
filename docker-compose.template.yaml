services:
  identity-service:
    build:
      context: .
      dockerfile: Dockerfile.local
      additional_contexts:
        core: ../core
        proto: ../proto
      args:
        SERVICE_VERSION: local-workspace
      platforms:
        - linux/amd64
    image: invenlore-identity-service:local
    pull_policy: build
    networks:
      - invenlore-network
    ports:
      - "8081"
      - "8080"
    environment:
      - APP_ENV=dev
      - APP_LOG_LEVEL=DEBUG
      - SERVICE_NAME=identity
      - SERVICE_VERSION=local-workspace
      - GRPC_PORT=8080
      - HEALTH_PORT=8081
      - METRICS_PORT=9090
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin&directConnection=true
      - MONGO_DATABASE_NAME=invenlore-identity-service-db
      - MONGO_HEALTHCHECK_TIMEOUT=2s
      - MONGO_HEALTHCHECK_INTERVAL=10s
      - MONGO_OPERATION_TIMEOUT=10s
      - MONGO_MIGRATION_TIMEOUT=1m
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      restart_policy:
        condition: on-failure

  mongodb:
    image: mongo:8.2.3
    container_name: invenlore-identity-service-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: invenlore-identity-service-db
    volumes:
      - mongo_data:/data/db
    networks:
      - invenlore-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u root -p rootpass --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  invenlore-network:
    external: true

volumes:
  mongo_data:
    name: invenlore-identity-service-mongo_data
